name: macOS Release

# The Windows release host builds Windows locally and Linux over SSH; this is
# its macOS half, dispatched by tools/release_other_platforms.py once the
# release is published. (cloud-release.yml has its own macOS job.)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build the macOS app for and attach it to
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        run: ./build.sh

      - name: Attach to release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          cp "dist/Plexible-macos.zip" "Plexible-$TAG-macos.zip"
          # The release tag can predate the helper: run it from this workflow's commit.
          curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/commit/$GITHUB_SHA/tools/forgejo_release.py" -o "$RUNNER_TEMP/forgejo_release.py"
          python3 "$RUNNER_TEMP/forgejo_release.py" upload "$TAG" "Plexible-$TAG-macos.zip"
